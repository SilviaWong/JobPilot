server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: job-pilot-server
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 优先读取环境变量 DB_PATH，若未设置则读取 JobPilot 独立专属数据库
    url: jdbc:sqlite:${DB_PATH:/Users/wangyanan/Projects2/JobPilot/data/jobpilot.db}?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA busy_timeout=10000; PRAGMA synchronous=NORMAL;"
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  type-handlers-package: com.jobpilot.jobpilotserver.common.config
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid

logging:
  level:
    com.jobpilot: debug
